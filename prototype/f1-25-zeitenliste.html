<!DOCTYPE html>
<html lang="de">
<head>

<style>

body.tv{max-width:none;padding:2vmin 3vw}

.tvbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1vmin}

.pod{display:flex;align-items:flex-end;gap:8px;margin:12px 0 10px}

.chart{margin:6px 0 4px}.chart svg{width:100%;height:auto;display:block}
.x{border:0;background:none;color:var(--mu);font-size:18px;padding:4px 8px}
h2{font-size:16px;margin:16px 0 4px}
.sub{color:var(--mu);font-size:14px;margin:2px 0 8px}
.empty{color:var(--mu);padding:12px 4px}
</style>
</head>
