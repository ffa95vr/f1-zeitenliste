# Baut die App bei jedem Push auf main und stellt sie auf GitHub Pages online.
# Benötigt unter Settings → Secrets and variables → Actions → Variables:
#   VITE_SUPABASE_URL       (Project URL von Supabase)
#   VITE_SUPABASE_ANON_KEY  (öffentlicher publishable/anon key – NIE den secret/service_role key)
name: Online stellen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prüfen, ob die Supabase-Werte hinterlegt sind
        run: |
          if [ -z "${{ vars.VITE_SUPABASE_URL }}" ] || [ -z "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::VITE_SUPABASE_URL oder VITE_SUPABASE_ANON_KEY fehlt (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
